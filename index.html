<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Amalan Harian"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Amalan Harian</title><style>body{margin:0;background:#ecfdf5;color:#134e4a;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:18px 14px 80px}.panel{background:white;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 3px 18px #134e4a10}h1{margin:0;font-size:25px}h2{font-size:20px}.muted{font-size:13px;color:#64748b}.percent{font-size:44px;font-weight:800;color:#0f766e}.bar{height:12px;background:#ccfbf1;border-radius:20px;overflow:hidden}.fill{height:100%;background:#0d9488}nav{display:flex;gap:6px;overflow:auto;margin:12px 0}nav button{min-width:78px;flex:1;padding:13px 7px;border:0;border-radius:12px;background:#ccfbf1;color:#115e59;font-weight:700}nav .active{background:#0f766e;color:white}.task{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #e2e8f0}.task input{width:24px;height:24px;accent-color:#0d9488}.task label{flex:1}.task small{display:block;color:#64748b;margin-top:3px}details{margin-top:8px;padding:9px;background:#f0fdfa;border-radius:9px;font-size:14px;line-height:1.5}summary{color:#0f766e;font-weight:650}input[type=date],button.reset{border:1px solid #99f6e4;background:white;border-radius:10px;padding:10px;font-size:16px}footer{font-size:12px;color:#64748b;line-height:1.6}</style></head><body><main><header class="panel"><h1>🌙 Amalan Harian</h1><p class="muted">Senarai semak Subuh hingga Isyak</p><input type="date" id="date"><div id="percent" class="percent">0%</div><div class="bar"><div class="fill" id="fill"></div></div><p id="count" class="muted"></p></header><nav id="tabs"></nav><section class="panel"><h2 id="title"></h2><div id="tasks"></div></section><section class="panel"><h2>Ringkasan harian</h2><div id="summary"></div><button class="reset" id="reset">Set semula tarikh ini</button></section><footer>Peratus menunjukkan kemajuan senarai semak, bukan ukuran pahala. Bilangan bacaan berpandukan rujukan dan bukan semuanya ketetapan sunnah. Rekod disimpan pada peranti ini sahaja.</footer></main><script>
const groups=[
["Subuh","🌅",[["Ayat Seribu Dinar","3 kali","Wa man yattaqillaha yaj‘al lahu makhraja. Wa yarzuqhu min haisu la yahtasib. Wa man yatawakkal ‘alallahi fahuwa hasbuh. Innallaha balighu amrih. Qad ja‘alallahu likulli syai’in qadra."],["Subhanallah","33 kali"],["Alhamdulillah","33 kali"],["Allahu Akbar","34 kali"],["Istighfar","100 kali"],["Hasbunallahu wa ni‘mal wakil","7 kali"],["Surah Al-Ikhlas","3 kali"],["Surah Al-Falaq","3 kali"],["Surah An-Nas","3 kali"]]],
["Dhuha / Pagi","☀️",[["Solat Sunat Dhuha","2 atau 4 rakaat"],["Doa Dhuha","1 kali","Ya Allah, jika rezekiku masih di langit, turunkanlah. Jika di bumi, keluarkanlah. Jika sukar, mudahkanlah. Jika jauh, dekatkanlah. Jika haram, sucikanlah. Jika sedikit, perbanyakkanlah. Limpahkanlah rezeki kepada aku sepertimana Engkau limpahkan kepada hamba-hamba-Mu yang soleh."],["Ya Wahhab","100 kali"],["Ya Razzaq","33 kali"],["La hawla wa la quwwata illa billah","33 kali"],["Istighfar","100 kali"],["Doa Nabi Yunus","33 kali","La ilaha illa Anta, subhanaka inni kuntu minaz-zalimin."]]],
["Zohor","🌤️",[["Doa Nabi Yunus","100 kali atau ikut kemampuan","La ilaha illa Anta, subhanaka inni kuntu minaz-zalimin."],["Ya Latif","33 kali"],["Ya Fattah","33 kali"],["Istighfar","100 kali"]]],
["Asar / Petang","🌇",[["Ucap syukur kepada Allah","1 kali"],["Istighfar","100 kali"],["Selawat","100 kali"],["Doa ringkas","1 kali","Ya Allah, cukupkan aku dengan rezeki hari ini. Kurniakan ketenangan dan lindungilah hatiku dari resah yang tidak perlu."]]],
["Maghrib – Isyak","🌙",[["Dua ayat terakhir Surah Al-Baqarah","Ayat 285–286, 1 kali"],["Subhanallah","33 kali"],["Alhamdulillah","33 kali"],["Allahu Akbar","34 kali"],["Hasbunallah","7 kali"],["Surah Al-Mulk","Jika sempat"],["Doa sebelum tidur","1 kali","Ya Allah, aku serahkan jiwaku kepada-Mu. Ampunilah aku, lindungilah tidurku, dan bangunkan aku dalam rahmat-Mu."]]]];
const el=id=>document.getElementById(id);let tab=0;const d=new Date();el("date").value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");const key=(i,j)=>"amalan-v1:"+el("date").value+":"+i+":"+j;const done=(i,j)=>localStorage.getItem(key(i,j))==="1";function render(){let total=0,finished=0;groups.forEach((g,i)=>g[2].forEach((_,j)=>{total++;if(done(i,j))finished++}));const pct=Math.round(finished/total*100);el("percent").textContent=pct+"%";el("fill").style.width=pct+"%";el("count").textContent=finished+" daripada "+total+" amalan selesai";el("tabs").replaceChildren();groups.forEach((g,i)=>{const b=document.createElement("button");b.textContent=g[1]+" "+["Subuh","Dhuha","Zohor","Asar","Isyak"][i];b.className=i===tab?"active":"";b.onclick=()=>{tab=i;render()};el("tabs").append(b)});el("title").textContent=groups[tab][1]+" "+groups[tab][0];el("tasks").replaceChildren();groups[tab][2].forEach((a,j)=>{const row=document.createElement("div");row.className="task";const c=document.createElement("input");c.type="checkbox";c.checked=done(tab,j);c.id="t"+j;c.onchange=()=>{if(c.checked)localStorage.setItem(key(tab,j),"1");else localStorage.removeItem(key(tab,j));render()};const label=document.createElement("label");label.htmlFor=c.id;const name=document.createElement("strong");name.textContent=a[0];const small=document.createElement("small");small.textContent=a[1];label.append(name,small);if(a[2]){const details=document.createElement("details");const s=document.createElement("summary");s.textContent="Lihat bacaan / doa";const p=document.createElement("p");p.textContent=a[2];details.append(s,p);label.append(details)}row.append(c,label);el("tasks").append(row)});el("summary").replaceChildren();groups.forEach((g,i)=>{const n=g[2].filter((_,j)=>done(i,j)).length;const p=document.createElement("p");p.className="muted";p.textContent=g[1]+" "+g[0]+": "+n+"/"+g[2].length+" ("+Math.round(n/g[2].length*100)+"%)";el("summary").append(p)})}el("date").onchange=render;el("reset").onclick=()=>{if(confirm("Kosongkan semua tanda untuk tarikh ini?")){groups.forEach((g,i)=>g[2].forEach((_,j)=>localStorage.removeItem(key(i,j))));render()}};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
